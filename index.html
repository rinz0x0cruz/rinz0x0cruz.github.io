<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- the poster fills the largest region on screen, so fetch it before the
         module graph rather than after it -->
    <link
      rel="preload"
      as="image"
      href="/background-study-wide-still.webp"
      media="(min-width: 701px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/background-study-still.webp"
      media="(max-width: 700px)"
      fetchpriority="high"
    />
    <title>Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
