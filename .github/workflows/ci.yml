name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run setup:browsers:with-deps
      - run: npm test
      # npm test builds before running the suite, so dist is exactly what passed
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live site
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          verify_revision() {
            python3 -c 'import json, os, sys; metadata = json.load(sys.stdin); sys.exit(0 if metadata.get("revision") == os.environ["EXPECTED_REVISION"] else 1)'
          }
          for attempt in {1..12}; do
            if html="$(curl --fail --silent --show-error --location "$base_url/")" \
              && blog="$(curl --fail --silent --show-error --location "$base_url/blog/")" \
              && build_meta="$(curl --fail --silent --show-error --location "$base_url/build-meta.json")" \
              && grep -Fq '<title>Mohit Sharma — Security Researcher</title>' <<<"$html" \
              && grep -Fq 'content="https://rinz0x0cruz.github.io/social-card.jpg"' <<<"$html" \
              && grep -Fq '<link rel="canonical" href="https://rinz0x0cruz.github.io/blog/">' <<<"$blog" \
              && verify_revision <<<"$build_meta"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Revision $EXPECTED_REVISION and its expected artifacts did not reach $PAGE_URL" >&2
              exit 1
            fi
            sleep 5
          done
          feed="$(curl --fail --silent --show-error --location "$base_url/blog/feed.xml")"
          robots="$(curl --fail --silent --show-error --location "$base_url/robots.txt")"
          sitemap="$(curl --fail --silent --show-error --location "$base_url/sitemap.xml")"
          grep -Fq '<rss version="2.0">' <<<"$feed"
          grep -Fq 'https://rinz0x0cruz.github.io/sitemap.xml' <<<"$robots"
          grep -Fq '<loc>https://rinz0x0cruz.github.io/blog/</loc>' <<<"$sitemap"
          curl --fail --silent --show-error --head --location "$base_url/social-card.jpg" >/dev/null